# TEMPLATE ONLY. Not installed or executed.
# The limit_req_zone line belongs in http context; server belongs in the same context.
# Provision certificates, PHP-FPM pool and its QR_STAGING_CONFIG environment separately.
limit_req_zone $binary_remote_addr zone=qr_staging:10m rate=5r/s;
server {
    listen 443 ssl;
    server_name qr-staging.example.invalid;
    ssl_certificate /etc/qr-staging/tls/fullchain.pem;
    ssl_certificate_key /etc/qr-staging/tls/privkey.pem;
    root /srv/qr-backend-staging/public;
    autoindex off;
    client_max_body_size 8k;
    # Use a dedicated FPM pool/user. Never a shared production pool.
    location ~ ^/(?:qr/(?:save_scan|get_random_scans|delete_scan|delete_all_scans|create_employee|dashboard|submit_scan)|auth/whoami)\.php$ {
        limit_req zone=qr_staging burst=10 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/qr-staging.sock;
    }
    location / { return 404; }
}
# Dedicated FPM pool environment, outside source control:
# env[QR_STAGING_CONFIG] = /etc/qr-staging/config.json
# php_admin_flag[display_errors] = off
# php_admin_flag[log_errors] = on
# php_admin_value[error_log] = /var/log/qr-staging/php-error.log
# Restrict ingress to approved testers/VPN at the hosting boundary.
# DB: loopback only. No production connectivity. No outbound mail/Firebase.
